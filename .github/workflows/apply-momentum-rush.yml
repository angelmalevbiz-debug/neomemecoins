name: Apply Momentum Rush PAPER Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-momentum-rush.yml

permissions:
  contents: write

concurrency:
  group: momentum-rush-paper-patch
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PAPER backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply isolated PAPER patch
        run: python scripts/apply_momentum_rush_patch.py
      - name: Verify Python syntax
        run: python -m py_compile backend/*.py
      - name: Run Strategy Lab regression tests
        env:
          PYTHONPATH: backend
        run: python -m unittest tests.test_lab_activity
      - name: Run repository Python checks and strategy lock
        run: python scripts/run_python_checks.py
      - name: Verify diff
        run: git diff --check
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/strategy_lab.py tests/test_lab_activity.py strategy-lock.json
          if git diff --cached --quiet; then
            echo "Momentum Rush integration is already current; no commit needed."
            exit 0
          fi
          git commit -m "Integrate Momentum Rush Brain PAPER strategy"
          git push origin HEAD:main
