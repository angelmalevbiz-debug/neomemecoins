name: Restore verified NEO source snapshot
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dispatched repository state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and restore the source archive
        env:
          EXPECTED_SHA256: 481e3478b0dff72f743bb17a286bb11c607e24165b7da5828c911022e7e4b02f
          BASE_SHA: f3aa701fe1fde5d2b2bdf578ec92606488b406c6
        run: |
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python - <<'PY'
          import hashlib, os, pathlib, stat, zipfile
          root = pathlib.Path.cwd().resolve()
          archive = root / "neomemecoins-ready.zip"
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if digest != os.environ["EXPECTED_SHA256"]:
              raise SystemExit(f"Source archive SHA mismatch: {digest}")
          seen = set()
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  rel = pathlib.PurePosixPath(item.filename)
                  mode = (item.external_attr >> 16) & 0xffff
                  if rel.is_absolute() or ".." in rel.parts or not rel.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if rel.parts[0] in {".git", ".github", ".runtime", ".venv", "node_modules", "dist"}:
                      raise SystemExit(f"Forbidden archive path: {item.filename}")
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink in archive: {item.filename}")
                  if item.filename in seen:
                      raise SystemExit(f"Duplicate archive path: {item.filename}")
                  seen.add(item.filename)
                  target = (root / pathlib.Path(*rel.parts)).resolve()
                  if root not in target.parents:
                      raise SystemExit(f"Archive path escapes checkout: {item.filename}")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(bundle.read(item))
          if len(seen) < 100:
              raise SystemExit(f"Unexpectedly small source archive: {len(seen)} files")
          print(f"Restored {len(seen)} verified files ({digest})")
          PY
          git rm -f neomemecoins-ready.zip .github/workflows/bootstrap-pages.yml
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and verify
        run: |
          npm ci
          python -m pip install -r requirements.txt
          python scripts/run_python_checks.py
          npm run lint
          npm run build
          git diff --check
      - name: Commit verified source and remove the one-time restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified PAPER training and dashboard fixes"
          git push origin HEAD:main
