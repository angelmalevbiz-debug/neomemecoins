name: Apply verified PAPER dashboard update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-update.zip'

permissions:
  contents: write
  actions: write

concurrency:
  group: neo-verified-paper-update
  cancel-in-progress: false

env:
  VITE_NEO_API_URL: ${{ vars.NEO_API_URL }}

jobs:
  update:
    if: github.repository == 'angelmalevbiz-debug/neomemecoins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact uploaded revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack exact source allowlist
        env:
          EXPECTED_SHA256: 94b8a1e827921ca683ff4624cf0529ef879b7d5e9bebbec6fcd5b06bcc01273f
          EXPECTED_PARENT: 00087cf449d6d77a457577d7eb8b34ea50fbd815
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, subprocess, zipfile
          from pathlib import Path, PurePosixPath

          archive_path = Path('.github/workflows/codex-update.zip')
          allowed = {
              'backend/lab_dashboard_projection.py',
              'backend/live_tape.py',
              'backend/tests/test_lab_dashboard_projection.py',
              'scripts/start_local_paper.ps1',
              'src/App.tsx',
              'strategy-lock.json',
          }
          if hashlib.sha256(archive_path.read_bytes()).hexdigest() != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Update archive SHA-256 did not match the reviewed payload.')
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != os.environ['EXPECTED_PARENT']:
              raise SystemExit('main changed after the reviewed base; refusing to apply this payload.')
          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)) or set(names) != allowed:
                  raise SystemExit(f'Unexpected update files: {names!r}')
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '\\' in name:
                      raise SystemExit(f'Unsafe archive path: {name!r}')
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
          print('Verified and unpacked exactly six reviewed source files.')
          PY
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt
      - name: Verify Python backend and tests
        run: |
          python3 -m py_compile backend/*.py
          python3 scripts/run_python_checks.py
      - name: Verify frontend
        run: npm run lint
      - name: Build site and verify strategy lock
        run: npm run build
      - name: Commit source and remove temporary upload files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lab_dashboard_projection.py backend/live_tape.py backend/tests/test_lab_dashboard_projection.py scripts/start_local_paper.ps1 src/App.tsx strategy-lock.json
          git rm -f .github/workflows/bootstrap-pages.yml .github/workflows/codex-update.zip
          git commit -m 'Show strategy PAPER trades and bound live tape ingestion'
          git push origin HEAD:main
      - name: Dispatch the repository Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
          commit="$(git rev-parse HEAD)"
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/runs?event=workflow_dispatch&branch=main&per_page=20" --jq ".workflow_runs[] | select(.head_sha == \"${commit}\") | .id" | head -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo 'Pages workflow was dispatched but its run did not appear in the API.'
            exit 1
          fi
          gh run watch --exit-status "$run_id"