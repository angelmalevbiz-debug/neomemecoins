name: Restore verified Lab runtime fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-pages.yml
permissions:
  contents: write
  actions: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate archive and restore the reviewed files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import stat
          import subprocess
          import zipfile
          from pathlib import PurePosixPath

          expected_base = "d983b1de48958d0a9dabc4ae37d210d6c175c83e"
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          if parent != expected_base:
              raise SystemExit(f"Unexpected base commit: {parent}")

          archive = "neo-lab-runtime-fix.zip"
          expected_digest = "bd604b11c522b4521f4582788aded2b3685f1fa3b56ca1dc4970c9b39fc40c83"
          actual_digest = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          if actual_digest != expected_digest:
              raise SystemExit(f"Archive digest mismatch: {actual_digest}")

          allowed = {
              "backend/strategy_lab.py",
              "docs/DEPLOYMENT_STATUS.md",
              "docs/PAPER_RUNBOOK.md",
              "scripts/local_paper_service.py",
              "scripts/start_local_paper.ps1",
              "strategy-lock.json",
              "tests/test_lab_activity.py",
          }
          with zipfile.ZipFile(archive) as bundle:
              entries = bundle.infolist()
              names = [item.filename for item in entries]
              if len(names) != 7 or set(names) != allowed:
                  raise SystemExit(f"Unexpected archive contents: {names}")
              for item in entries:
                  path = PurePosixPath(item.filename)
                  mode = (item.external_attr >> 16) & 0o170000
                  if path.is_absolute() or ".." in path.parts or "\\" in item.filename or mode == stat.S_IFLNK:
                      raise SystemExit(f"Unsafe archive entry: {item.filename}")
              bundle.extractall(".")
          PY
          git rm -- neo-lab-runtime-fix.zip .github/workflows/bootstrap-pages.yml
          git add -- backend/strategy_lab.py docs/DEPLOYMENT_STATUS.md docs/PAPER_RUNBOOK.md scripts/local_paper_service.py scripts/start_local_paper.ps1 strategy-lock.json tests/test_lab_activity.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Run Python checks
        run: python scripts/run_python_checks.py
      - name: Check the locked strategy
        run: npm run check:strategy
      - name: Lint
        run: npm run lint
      - name: Build and package the app
        run: npm run build
      - name: Check patch whitespace
        run: git -c core.whitespace=cr-at-eol diff --check
      - name: Commit and push the validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore shared-feed local Strategy Lab runtime fix"
          git push origin HEAD:main
      - name: Dispatch the GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --url "https://api.github.com/repos/angelmalevbiz-debug/neomemecoins/actions/workflows/deploy-pages.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}'
