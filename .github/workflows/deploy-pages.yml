name: Deploy NEO Meme Trade

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  VITE_NEO_API_URL: https://neo-meme-api.169-58-211-177.sslip.io

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Install PAPER backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python backend syntax
        run: |
          python3 -m py_compile backend/*.py
          python3 scripts/run_python_checks.py

      - name: Type check frontend
        run: npm run lint

      - name: Build and verify strategy lock
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
